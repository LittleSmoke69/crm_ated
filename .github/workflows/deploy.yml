name: Deploy stack leve na VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-vps-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: SSH_HOST

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 60m
          script: |
            set -Eeuo pipefail

            DEPLOY_DIR="/opt/crm-ated"
            cd "$DEPLOY_DIR"

            echo "Atualizando código..."
            test -d .git
            if [ ! -f .env ]; then
              echo "Arquivo .env ausente em $DEPLOY_DIR"
              exit 1
            fi
            if [ ! -r .env ]; then
              echo "Arquivo .env existe, mas o usuário $(whoami) não consegue ler."
              echo "Na VPS rode: sudo chown $(whoami):$(whoami) $DEPLOY_DIR/.env && sudo chmod 600 $DEPLOY_DIR/.env"
              ls -la .env || true
              exit 1
            fi
            deploy_marker="$DEPLOY_DIR/.git/last-successful-deploy"
            git fetch origin main
            git checkout main
            git merge --ff-only origin/main

            application_changed=1
            if [ -s "$deploy_marker" ]; then
              last_successful_commit="$(cat "$deploy_marker")"
              if git cat-file -e "${last_successful_commit}^{commit}" 2>/dev/null && \
                git diff --quiet "$last_successful_commit" HEAD -- . \
                  ':(exclude)migrations/**' \
                  ':(exclude)docs/**' \
                  ':(exclude)*.md' \
                  ':(exclude).github/**'; then
                application_changed=0
              fi
            else
              echo "Sem marcador de deploy concluído: rebuild completo será executado."
            fi

            echo "Validando ambiente e Compose..."
            test -n "$(sed -n 's/^NEXT_PUBLIC_SUPABASE_URL=//p' .env)"
            test -n "$(sed -n 's/^NEXT_PUBLIC_SUPABASE_ANON_KEY=//p' .env)"
            test -n "$(sed -n 's/^SUPABASE_SERVICE_ROLE_KEY=//p' .env)"

            # Cap do Sucesso: Evolution no chat exige escopo full (modelagem zera /api/chat/channels).
            upsert_env() {
              local key="$1"
              local val="$2"
              if grep -qE "^${key}=" .env; then
                sed -i "s|^${key}=.*|${key}=${val}|" .env
              else
                printf '\n%s=%s\n' "$key" "$val" >> .env
              fi
            }
            echo "Garantindo escopo full (Evolution) no .env..."
            upsert_env ZAPLOTO_APP_SCOPE full
            upsert_env NEXT_PUBLIC_ZAPLOTO_APP_SCOPE full
            upsert_env ZAPLOTO_DISABLE_EVOLUTION_STACK false
            upsert_env NEXT_PUBLIC_ZAPLOTO_DISABLE_EVOLUTION_STACK false
            upsert_env SITE_URL https://capdosucesso.co.uk
            upsert_env URL https://capdosucesso.co.uk
            upsert_env NEXT_PUBLIC_SITE_URL https://capdosucesso.co.uk
            upsert_env NEXT_PUBLIC_APP_URL https://capdosucesso.co.uk
            upsert_env NEXT_PUBLIC_WEBHOOK_BASE_URL https://capdosucesso.co.uk
            upsert_env EVOLUTION_BASE_URL https://evolution.capdosucesso.co.uk
            upsert_env EVOLUTION_WEBHOOK_SKIP_MASTER false
            # Remove flags de localhost se existirem
            sed -i '/^EVOLUTION_WEBHOOK_ALLOW_NO_TOKEN=/d' .env || true
            sed -i '/^EVOLUTION_WEBHOOK_ALLOW_LOCALHOST=/d' .env || true

            # Garante franklin (e carlinhosbig) em SUPER_ADMIN_USERNAMES — fora da equipe na Gestão do Chat
            current_sa="$(sed -n 's/^SUPER_ADMIN_USERNAMES=//p' .env | tr -d '\r' | tr -d ' ')"
            if [ -z "$current_sa" ]; then
              upsert_env SUPER_ADMIN_USERNAMES "carlinhosbig,franklin"
            else
              merged="$current_sa"
              echo ",${merged}," | grep -qi ',franklin,' || merged="${merged},franklin"
              echo ",${merged}," | grep -qi ',carlinhosbig,' || merged="carlinhosbig,${merged}"
              upsert_env SUPER_ADMIN_USERNAMES "$merged"
            fi

            SCOPE="$(sed -n 's/^ZAPLOTO_APP_SCOPE=//p' .env | tr -d '\r')"
            test "$SCOPE" = "full"
            docker compose config --quiet

            echo "Aplicando migrations modelagem..."
            docker exec supabase-db psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c \
              "CREATE TABLE IF NOT EXISTS public.app_migration_history (filename text PRIMARY KEY, applied_at timestamptz NOT NULL DEFAULT now());"
            for migration_file in migrations/modelagem/[0-9][0-9]_*.sql; do
              migration_name="$(basename "$migration_file")"
              already_applied="$(docker exec supabase-db psql -U postgres -d postgres -tAc \
                "SELECT 1 FROM public.app_migration_history WHERE filename = '${migration_name}'")"
              if [ "$already_applied" = "1" ]; then
                echo "Ignorando já aplicada: $migration_name"
                continue
              fi
              echo "Aplicando: $migration_file"
              docker exec -i supabase-db \
                psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
                < "$migration_file"
              printf "INSERT INTO public.app_migration_history (filename) VALUES ('%s');\n" "$migration_name" | \
                docker exec -i supabase-db psql -U postgres -d postgres -v ON_ERROR_STOP=1
            done

            # Garante flag de chat nas instâncias mestres (gate do /chat)
            docker exec supabase-db psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c \
              "UPDATE public.evolution_instances SET is_chat_instance = true WHERE is_master = true AND COALESCE(is_chat_instance, false) = false;" \
              || echo "Aviso: não foi possível atualizar is_chat_instance (tabela ausente?)"

            if [ "$application_changed" = "0" ]; then
              echo "Somente migrations/documentação: build e restart dispensados."
              git rev-parse HEAD > "$deploy_marker"
              docker compose ps
              exit 0
            fi

            echo "Construindo imagem única..."
            docker compose build app1

            wait_for_health() {
              service="$1"
              port="$2"
              for attempt in $(seq 1 36); do
                if curl --connect-timeout 3 --max-time 5 -fsS \
                  "http://127.0.0.1:${port}/api/health" >/dev/null; then
                  echo "$service saudável na porta $port"
                  return 0
                fi
                sleep 5
              done
              echo "Health check falhou: $service na porta $port"
              docker compose logs --tail=120 "$service"
              return 1
            }

            echo "Atualização gradual: app2..."
            docker compose up -d --no-deps --force-recreate app2
            wait_for_health app2 3001

            echo "Atualização gradual: app1..."
            docker compose up -d --no-deps --force-recreate app1
            wait_for_health app1 3000

            docker compose up -d --remove-orphans

            docker image prune -f
            docker compose ps
            git rev-parse HEAD > "$deploy_marker"
            echo "Deploy concluído."
